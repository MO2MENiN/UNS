<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>أنس - UNS | الأذكار والأدعية</title>
<meta name="description" content="تطبيق أنس للأذكار والأدعية اليومية، يعمل بالكامل بدون إنترنت." />
<meta name="theme-color" content="#0F1F1A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48" />

<!-- iOS-specific PWA support: Safari ignores most of manifest.json, so "Add to Home
     Screen" relies on these meta tags for standalone mode, status bar style, the name
     shown under the icon, and an opaque (non-transparent) touch icon. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="أنس" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/section.css" />
<link rel="stylesheet" href="css/dhikr.css" />
<link rel="stylesheet" href="css/settings.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<script>
  // Decode the path GitHub Pages' 404.html redirect trick encoded into the query string,
  // and restore the real URL before the router reads it. No-op on any normal host/route.
  (function (l) {
    if (l.search[1] !== '/') return;
    var decoded = l.search.slice(1).split('&').map(function (s) {
      return s.replace(/~and~/g, '&');
    }).join('?');
    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
  })(window.location);
</script>

<div id="app">
  <header class="app-header" id="appHeader" hidden>
    <button class="app-header__back" id="backBtn" aria-label="رجوع">
      <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-back"></use></svg>
    </button>
    <h1 class="app-header__title"></h1>
  </header>

  <header class="home-header" id="homeHeader" hidden>
    <div class="home-header__row">
      <div class="home-header__brand">
        <div class="home-header__mark">
          <img src="assets/icons/app-icon-192.png" alt="" width="42" height="42" />
        </div>
        <div>
          <p class="home-header__title">أنس</p>
          <p class="home-header__subtitle">الأذكار والأدعية اليومية</p>
        </div>
      </div>
      <button class="btn btn--icon home-header__theme" id="themeToggleBtn" aria-label="تبديل المظهر"></button>
    </div>
    <div class="search-field home-header__search" id="homeSearchField">
      <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-search"></use></svg>
      <input type="search" id="homeSearchInput" placeholder="ابحث في الأذكار والأدعية…" aria-label="بحث" />
    </div>
  </header>

  <main id="view" role="main"></main>

  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <div class="tabbar__items">
      <a class="tabbar__item is-active" data-route="home" href="/" data-route-link aria-label="الرئيسية">
        <span class="tabbar__bump">
          <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-home"></use></svg>
        </span>
      </a>
      <a class="tabbar__item" data-route="favorites" href="/favorites" data-route-link aria-label="المفضلة">
        <span class="tabbar__bump">
          <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-star"></use></svg>
        </span>
      </a>
      <a class="tabbar__item" data-route="settings" href="/settings" data-route-link aria-label="الإعدادات">
        <span class="tabbar__bump">
          <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-settings"></use></svg>
        </span>
      </a>
    </div>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
