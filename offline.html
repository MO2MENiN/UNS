<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>أنس - لا يوجد اتصال</title>
  <meta name="theme-color" content="#0F766E" />
  <link rel="icon" href="assets/icons/favicon.ico" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F6F1;
      color: #1E293B;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      direction: rtl;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0D1412; color: #ECEDEE; }
    }
    .wrap { max-width: 380px; }
    img { width: 84px; height: 84px; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; margin: 0 0 10px; }
    p { color: #64748B; line-height: 1.7; margin: 0 0 24px; }
    button {
      background: #0F766E;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/icons/icon-128.png" alt="أنس" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يمكنك متابعة استخدام أنس بشكل طبيعي — الصفحات والأذكار التي فتحتها من قبل متاحة بدون إنترنت.</p>
    <button onclick="location.href='index.html'">العودة إلى التطبيق</button>
  </div>
</body>
</html>
